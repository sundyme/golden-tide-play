<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>金潮号 GOLDEN TIDE</title>
  <meta name="theme-color" content="#050b1c" />
  <link rel="icon" href="./public/assets/ui/icon_coin.webp" />
  <!-- 字体、three、Rapier 全部本地托管（Google Fonts / jsDelivr 在国内不稳定）；字体子集用 tools/build_fonts.py 生成 -->
  <link rel="preload" href="./public/assets/fonts/zcool-qingke.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./public/assets/fonts/lilita-one.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="modulepreload" href="./public/vendor/three/build/three.core.min.js" />
  <link rel="modulepreload" href="./public/vendor/rapier/rapier.mjs" />
  <link rel="stylesheet" href="./src/ui/ui.css" />
  <style>
    @font-face { font-family: "ZCOOL QingKe HuangYou"; src: url(./public/assets/fonts/zcool-qingke.woff2) format("woff2"); font-display: swap; }
    @font-face { font-family: "Lilita One"; src: url(./public/assets/fonts/lilita-one.woff2) format("woff2"); font-display: swap; }
    :root { --ink: #ffe9c2; --bg: #0b1a33; }
    html, body { margin: 0; height: 100%; background: #070d1c; color: var(--ink); font: 13px/1.4 -apple-system, "Hiragino Sans GB", sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    #stage { position: absolute; inset: 0; display: grid; place-items: center; }
    #frame { position: relative; aspect-ratio: 9 / 16; height: 100%; max-width: 100%; background: var(--bg); overflow: hidden; container-type: size; }
    canvas { display: block; width: 100%; height: 100%; }
    #stats { position: absolute; left: 10px; bottom: 26cqw; z-index: 3; font-size: 11px; opacity: .65; pointer-events: none; white-space: pre; font-family: ui-monospace, monospace; }
    #loading { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--bg); transition: opacity .4s; }
    /* 加载页：装饰艺术风的进度条（藏蓝珐琅槽 + 香槟金描边 + 金色进度 + 流光），两端各一颗菱形饰钉 */
    #loading { --u: min(1cqw, .8vh); background: radial-gradient(70% 45% at 50% 42%, #14305a 0%, #0a1830 55%, #050b18 100%); }
    #loading .inner { display: flex; flex-direction: column; align-items: center; }
    #loading .logo { width: calc(62 * var(--u)); filter: drop-shadow(0 calc(1.4 * var(--u)) calc(2 * var(--u)) #000a) drop-shadow(0 0 calc(4 * var(--u)) #ffc23a33); animation: loadfloat 3s ease-in-out infinite; }
    #loading .track { position: relative; width: calc(56 * var(--u)); margin-top: calc(7 * var(--u)); display: flex; align-items: center; justify-content: center; }
    #loading .track::before, #loading .track::after { content: ""; position: absolute; top: 50%; width: calc(2.4 * var(--u)); height: calc(2.4 * var(--u)); background: linear-gradient(135deg, #fff1c8, #d9b46a 50%, #8e6a30); transform: translateY(-50%) rotate(45deg); box-shadow: 0 0 calc(1.4 * var(--u)) #ffc23a66; }
    #loading .track::before { left: calc(-1.2 * var(--u)); } #loading .track::after { right: calc(-1.2 * var(--u)); }
    #loading .bar { width: calc(100% - calc(4.4 * var(--u))); height: calc(2.4 * var(--u)); border-radius: calc(1.2 * var(--u)); background: linear-gradient(180deg, #06101f, #0e2840); box-shadow: inset 0 0 0 calc(.3 * var(--u)) #d9b46a, inset 0 calc(.4 * var(--u)) calc(.6 * var(--u)) #000a, 0 0 calc(2 * var(--u)) #000a; padding: calc(.55 * var(--u)); box-sizing: border-box; }
    #loading .bar i { position: relative; display: block; height: 100%; width: 0; border-radius: calc(.7 * var(--u)); background: linear-gradient(180deg, #fff1c8 0%, #ffd36a 45%, #c47a1c 100%); box-shadow: 0 0 calc(1.6 * var(--u)) #ffc23a99; transition: width .35s ease-out; overflow: hidden; }
    #loading .bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, #fff9 50%, transparent 70%) -100% 0/60% 100% no-repeat; animation: loadshine 1.6s linear infinite; }
    #loading .msg { margin-top: calc(3.4 * var(--u)); font: calc(3.6 * var(--u)) "ZCOOL QingKe HuangYou", "Hiragino Sans GB", sans-serif; letter-spacing: .4em; text-indent: .4em; color: #e9d3a0; opacity: .85; }
    #loading .snd { margin-top: calc(6 * var(--u)); display: flex; align-items: center; gap: calc(1.4 * var(--u)); font: calc(3 * var(--u)) "ZCOOL QingKe HuangYou", "Hiragino Sans GB", sans-serif; letter-spacing: .2em; color: #e9d3a0; opacity: .55; animation: sndblink 2.4s ease-in-out infinite; transition: opacity .4s; }
    #loading .snd svg { width: calc(4 * var(--u)); height: calc(4 * var(--u)); fill: currentColor; }
    .snd-on #loading .snd { opacity: 0; animation: none; }
    @keyframes sndblink { 50% { opacity: .9; } }
    /* 手机横屏：画框只剩一条，盖一层提示（桌面横屏窗口照常居中显示竖屏画框） */
    #rotate { display: none; position: fixed; inset: 0; z-index: 50; background: radial-gradient(70% 60% at 50% 45%, #14305a, #050b18); color: #f6e2b0; flex-direction: column; align-items: center; justify-content: center; gap: 2.4vh; font-family: "ZCOOL QingKe HuangYou", sans-serif; text-align: center; }
    #rotate svg { width: 18vh; height: 18vh; color: #e0bc76; animation: rot 2.4s ease-in-out infinite; }
    #rotate b { font-weight: normal; font-size: 6vh; letter-spacing: .2em; }
    #rotate span { font-size: 3.6vh; letter-spacing: .2em; opacity: .7; }
    @keyframes rot { 0%, 30% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0); } }
    @media (orientation: landscape) and (max-height: 520px) and (pointer: coarse) { #rotate { display: flex; } }
    @keyframes loadshine { to { background-position: 250% 0; } }
    @keyframes loadfloat { 50% { transform: translateY(calc(-1 * var(--u))); } }
    .lil-gui.root { position: absolute; top: 44px; right: 6px; z-index: 20; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./public/vendor/three/build/three.module.min.js",
      "three/addons/": "./public/vendor/three/examples/jsm/",
      "@dimforge/rapier3d-compat": "./public/vendor/rapier/rapier.mjs",
      "lil-gui": "./public/vendor/lil-gui/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <div id="loading"><div class="inner"><img class="logo" src="./public/assets/ui/logo.webp" alt=""><div class="track"><div class="bar"><i id="loadbar"></i></div></div><div class="msg">起锚中…</div><div class="snd"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.6 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>轻触屏幕 · 开启配乐</div></div></div>
      <div id="stats"></div>
    </div>
  </div>
  <div id="rotate"><svg viewBox="0 0 64 64"><rect x="20" y="8" width="24" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="46" r="2" fill="currentColor"/><path d="M50 30a18 18 0 0 0-10-14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M38 12l3 5-5 2" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>请把手机竖过来玩</b><span>金潮号是竖屏游戏</span></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
